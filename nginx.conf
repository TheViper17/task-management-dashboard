server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxies to the `api` container (see docker-compose.yml) so the app can
    # keep calling same-origin /api/* in production, exactly as it does in
    # development via proxy.conf.json.
    location /api/ {
        proxy_pass http://api:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback: any non-file route resolves to index.html so Angular's
    # router (not nginx) decides what to render.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets (main-XXXX.js, chunk-XXXX.js, styles-XXXX.css) are
    # safe to cache aggressively — a new build always ships new hashes.
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
