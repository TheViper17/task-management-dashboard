<div class="analytics-page">
  <div class="analytics-page__charts">
    <section class="analytics-card">
      <h2>{{ 'analytics.tasksByPriority' | translate }}</h2>
      <app-priority-chart [data]="taskStore.priorityMix()" />
    </section>

    <section class="analytics-card">
      <h2>{{ 'analytics.tasksByStatus' | translate }}</h2>
      <app-status-chart [data]="taskStore.statusMix()" />
    </section>
  </div>

  <section class="analytics-card">
    <h2>{{ 'analytics.recentActivity' | translate }}</h2>
    <app-activity-feed [entries]="activityStore.entries()" />
  </section>
</div>
