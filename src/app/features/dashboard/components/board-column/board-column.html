<section class="board-column" [attr.aria-label]="title() + ' column'">
  <header class="board-column__header">
    <h2>{{ title() }}</h2>
    <span class="board-column__count">{{ tasks().length }}</span>
  </header>

  <div
    class="board-column__list"
    cdkDropList
    [id]="listId()"
    [cdkDropListData]="tasks()"
    [cdkDropListConnectedTo]="connectedLists()"
    (cdkDropListDropped)="taskMoved.emit($event)"
  >
    @for (task of tasks(); track task.id) {
      <app-task-card
        cdkDrag
        [cdkDragData]="task"
        [cdkDragDisabled]="isPending(task)"
        class="board-column__drag-item"
        [task]="task"
        (edit)="taskEdit.emit(task)"
        (delete)="taskDelete.emit(task)"
      />
    } @empty {
      <p class="board-column__empty">No tasks here.</p>
    }
  </div>
</section>
