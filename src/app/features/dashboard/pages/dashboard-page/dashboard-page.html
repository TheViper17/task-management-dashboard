<div class="dashboard-page">
  @if (taskStore.error()) {
    <div class="dashboard-page__error" role="alert">
      <mat-icon aria-hidden="true">error_outline</mat-icon>
      <p>Couldn't load your tasks. Please check your connection and try again.</p>
      <button type="button" mat-stroked-button (click)="taskStore.reload()">Retry</button>
    </div>
  } @else if (isInitialLoading()) {
    <div class="dashboard-page__skeleton" role="status" aria-label="Loading dashboard">
      <div class="skeleton-stats">
        @for (i of [1, 2, 3, 4]; track i) {
          <div class="skeleton-stat-card">
            <app-skeleton width="60%" height="12px" />
            <app-skeleton width="45%" height="28px" />
            <app-skeleton width="70%" height="11px" />
          </div>
        }
      </div>

      <div class="skeleton-toolbar">
        <app-skeleton width="320px" height="36px" radius="var(--app-radius-md)" />
        <app-skeleton width="150px" height="36px" radius="var(--app-radius-md)" />
      </div>

      <div class="dashboard-page__board">
        @for (col of [1, 2, 3]; track col) {
          <div class="skeleton-column">
            <app-skeleton width="90px" height="12px" />
            @for (card of [1, 2, 3]; track card) {
              <div class="skeleton-task-card">
                <app-skeleton width="52px" height="18px" radius="var(--app-radius-sm)" />
                <app-skeleton width="85%" height="15px" />
                <app-skeleton width="100%" height="11px" />
                <app-skeleton width="65%" height="11px" />
                <app-skeleton width="55%" height="11px" />
              </div>
            }
          </div>
        }
      </div>
    </div>
  } @else {
    <app-stat-cards-grid [statistics]="statistics()" />

    <app-task-toolbar
      [activeStatus]="taskStore.filters().status"
      [activePriority]="taskStore.filters().priority"
      [activeAssigneeId]="taskStore.filters().assigneeId"
      [assignees]="userStore.users()"
      (statusChange)="onStatusChange($event)"
      (priorityChange)="onPriorityChange($event)"
      (assigneeChange)="onAssigneeChange($event)"
      (newTaskClick)="onNewTask()"
    />

    <div class="dashboard-page__board">
      <app-board-column
        title="TO DO"
        status="todo"
        [tasks]="taskStore.columns().todo"
        [connectedLists]="connectedLists"
        (taskEdit)="onEditTask($event)"
        (taskDelete)="onDeleteTask($event)"
        (taskQuickEdit)="onQuickEditTask($event)"
        (taskMoved)="onTaskMoved($event)"
      />
      <app-board-column
        title="IN PROGRESS"
        status="in_progress"
        [tasks]="taskStore.columns().in_progress"
        [connectedLists]="connectedLists"
        (taskEdit)="onEditTask($event)"
        (taskDelete)="onDeleteTask($event)"
        (taskQuickEdit)="onQuickEditTask($event)"
        (taskMoved)="onTaskMoved($event)"
      />
      <app-board-column
        title="DONE"
        status="done"
        [tasks]="taskStore.columns().done"
        [connectedLists]="connectedLists"
        (taskEdit)="onEditTask($event)"
        (taskDelete)="onDeleteTask($event)"
        (taskQuickEdit)="onQuickEditTask($event)"
        (taskMoved)="onTaskMoved($event)"
      />
    </div>
  }
</div>
