<header class="header">
  <button
    type="button"
    class="header__icon-button header__menu-button"
    [attr.aria-label]="'header.menuToggle' | translate"
    (click)="menuClick.emit()"
  >
    <mat-icon aria-hidden="true">menu</mat-icon>
  </button>

  <div class="header__brand">
    <span class="header__logo">
      <mat-icon aria-hidden="true">dashboard</mat-icon>
    </span>
    <span class="header__title">{{ 'app.title' | translate }}</span>
  </div>

  <div class="header__search">
    <mat-icon aria-hidden="true">search</mat-icon>
    <input
      type="search"
      [formControl]="searchControl"
      [placeholder]="'header.searchPlaceholder' | translate"
      [attr.aria-label]="'header.searchLabel' | translate"
    />
  </div>

  <div class="header__actions">
    <button
      type="button"
      class="header__icon-button"
      [matMenuTriggerFor]="languageMenu"
      [attr.aria-label]="'header.language' | translate"
    >
      <mat-icon aria-hidden="true">language</mat-icon>
    </button>
    <mat-menu #languageMenu="matMenu">
      <!--
        Each language's own name is always written in its own script
        ("English", "العربية") regardless of the current UI language — the
        standard convention for a language picker, so a reader can find
        their language even if they can't read whichever one is active
        right now. Not translated content; see Header's own constants.
      -->
      <button
        type="button"
        mat-menu-item
        [class.header__language-option--active]="i18n.locale() === 'en'"
        (click)="setLocale('en')"
      >
        English
      </button>
      <button
        type="button"
        mat-menu-item
        [class.header__language-option--active]="i18n.locale() === 'ar'"
        (click)="setLocale('ar')"
      >
        العربية
      </button>
    </mat-menu>

    <button
      type="button"
      class="header__icon-button"
      [attr.aria-label]="'header.notifications' | translate"
      (click)="notificationsClick.emit()"
    >
      <mat-icon aria-hidden="true">notifications</mat-icon>
      @if (notificationCount() > 0) {
        <span class="header__badge">{{ notificationCount() }}</span>
      }
    </button>

    @if (currentUserInitials(); as initials) {
      <app-avatar [initials]="initials" [size]="36" />
    }
  </div>
</header>
